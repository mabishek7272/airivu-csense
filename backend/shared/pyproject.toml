[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csense-shared"
version = "0.1.0"
description = "Shared internal library for AIRIVU CSense backend services: config, tenant-aware DB access, security, audit/outbox."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "motor>=3.4",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.8",
  "python-json-logger>=2.0",
  "minio>=7.2",
]

[tool.setuptools.packages.find]
include = ["csense_shared*"]
