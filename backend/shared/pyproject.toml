[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csense-shared"
version = "0.1.0"
description = "Shared internal library for AIRIVU CSense backend services: config, tenant-aware DB access, security, audit/outbox."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.8",
  "python-json-logger>=2.0",
  "minio>=7.2",
  "httpx>=0.27",
  # The complete IANA database, as a first-party source for `zoneinfo`.
  #
  # Not optional, and not merely tidiness. The slim base images carry a partial system
  # tzdata: 486 zones with the deprecated aliases stripped out. Browsers still report
  # several of those aliases - `Intl.DateTimeFormat` returns `Asia/Calcutta` rather than
  # `Asia/Kolkata` on many systems - so `ZoneInfo('Asia/Calcutta')` raised in the
  # container while succeeding on a developer machine, and a site could not be created at
  # all from an Indian browser. Every rule schedule is evaluated in a site's zone, so an
  # incomplete database here means rules silently running at the wrong hour.
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
include = ["csense_shared*"]
