# Serves the built SPA. Listens on 8080 because the base image
# (nginx-unprivileged) runs as a non-root user, which cannot bind port 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: React Router owns client-side routes, so any path that
    # isn't a real file must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or users
    # keep loading a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
