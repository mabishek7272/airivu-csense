# Serves the built single-page site. Listens on 8080 because the base image
# (nginx-unprivileged) runs as a non-root user, which cannot bind port 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No SPA router here (single page, no client-side routes) — a real 404 for anything
    # unexpected rather than silently serving index.html for every path.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets and the pre-rendered showcase images are both immutable per
    # build — a fresh deploy ships under new hashed filenames, so long caching is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /showcase/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
