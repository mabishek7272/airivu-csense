name: CI

on:
  # Every branch, not just main. Work happens on feature branches for weeks before it
  # merges, and a pipeline that only runs on main finds problems at the worst moment -
  # when the branch is large and someone is trying to land it.
  push:
  pull_request:
  # So the pipeline can be exercised deliberately without inventing a commit.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the bandit SARIF upload below - code scanning needs this even though every
      # other step in this job only reads. GitHub Advanced Security (required for private
      # repos to accept a SARIF upload at all) may not be enabled here; that upload step
      # is `continue-on-error: true` for exactly that reason, so this permission grant
      # is inert rather than harmful on a repo where it doesn't apply.
      security-events: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: csense
          POSTGRES_USER: csense_app
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U csense_app -d csense"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: ci_minio_user
          MINIO_ROOT_PASSWORD: ci_minio_password
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: csense
      POSTGRES_USER: csense_app
      POSTGRES_PASSWORD: ci_test_password
      # Throwaway CI-only credentials for ephemeral service containers — never reused
      # anywhere else. Real environments get these from a secret store (TRD-SEC-003).
      POSTGRES_API_USER: csense_api
      POSTGRES_API_PASSWORD: ci_api_password
      POSTGRES_PLATFORM_API_USER: csense_platform_api
      POSTGRES_PLATFORM_API_PASSWORD: ci_platform_password
      TEST_POSTGRES_DSN: "host=localhost port=5432 dbname=csense user=csense_app password=ci_test_password"
      TEST_POSTGRES_API_DSN: "host=localhost port=5432 dbname=csense user=csense_api password=ci_api_password"
      TEST_POSTGRES_PLATFORM_DSN: "host=localhost port=5432 dbname=csense user=csense_platform_api password=ci_platform_password"
      TEST_MINIO_ENDPOINT: "localhost:9000"
      TEST_MINIO_USER: ci_minio_user
      TEST_MINIO_PASSWORD: ci_minio_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared library + service deps
        run: |
          pip install ./backend/shared
          pip install -r backend/migrations/requirements.txt
          pip install -r backend/tenant_api/requirements.txt
          pip install -r backend/admin_api/requirements.txt
          pip install -r backend/tests/requirements.txt
          pip install -r backend/notification_worker/requirements.txt
          pip install ruff mypy pip-audit bandit bandit-sarif-formatter

      - name: Lint (ruff)
        # `scripts/` too: the e2e and operational scripts are how this system gets
        # verified and recovered, so they are not somewhere lint should be optional.
        run: ruff check backend scripts

      - name: Dependency vulnerability scan (SCA)
        run: pip-audit -r backend/tenant_api/requirements.txt -r backend/admin_api/requirements.txt || true
        # TODO(Phase 8): remove `|| true` once the baseline is clean and this can gate merges.

      - name: Static analysis (SAST)
        # Non-blocking, same reasoning as the SCA step above: this surfaces real findings
        # (mostly low-confidence pattern matches - dynamic-SQL PATCH endpoints building a
        # column list from a Pydantic model's own fixed field names, which bandit cannot
        # tell apart from user-controlled input) rather than gating merges on a baseline
        # nobody has triaged yet.
        run: bandit -r backend scripts -ll -x '**/tests/**,**/node_modules/**,**/__pycache__/**' || true
        # TODO(Phase 8): triage the baseline (mostly PATCH-endpoint false positives,
        # `psql()` cleanup helpers in e2e scripts with no attacker-controlled input, and
        # `urlopen` calls against hardcoded operator-configured hosts) and turn this
        # blocking once it's actually clean rather than merely quiet.

      - name: Static analysis (SAST) - SARIF for code scanning
        # A second bandit run rather than a single `-f sarif` invocation: SARIF is a
        # machine-readable format, not something worth also making a human read in the
        # job log, so the human-facing run above stays on bandit's own default text
        # output and this one exists purely to produce the upload artifact below.
        run: bandit -r backend scripts -ll -x '**/tests/**,**/node_modules/**,**/__pycache__/**' -f sarif -o bandit.sarif || true

      - name: Upload bandit SARIF to code scanning
        if: always()
        continue-on-error: true
        # continue-on-error, not `|| true` on the action itself: code scanning upload
        # needs GitHub Advanced Security, which a private repo may not have enabled -
        # that 403 is expected and not a CI failure, same non-blocking philosophy as
        # every other scan step in this workflow (see this job's own SCA/SAST TODOs).
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Bootstrap non-superuser application roles
        working-directory: backend/migrations
        run: python bootstrap_roles.py

      - name: Run migrations against CI Postgres
        working-directory: backend/migrations
        run: alembic upgrade head

      - name: Unit + integration tests
        working-directory: backend
        run: pytest -v

  frontend-customer-crm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/customer-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerability scan (SCA)
        run: npm audit --audit-level=high || true
        # TODO(Phase 8): react-router 6->7 and vite 6->8 both carry real, non-breaking-
        # patch fixes here - the available fix is a major-version bump for each, which
        # needs its own dedicated testing pass, not a side effect of wiring the scan.

  frontend-developer-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/developer-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerability scan (SCA)
        run: npm audit --audit-level=high || true
        # TODO(Phase 8): the remaining findings here are eslint/typescript-eslint's own
        # build-time dependency chain (glob/minimatch) - a fix needs eslint-config-next
        # 16, itself a breaking change against this app's current eslint config, so it
        # needs its own pass rather than a side effect of wiring the scan. next.js itself
        # was already bumped to 14.2.35 (the latest 14.x patch) as part of adding this -
        # a real, low-risk fix, not merely a baseline note.

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
        # Expo SDK 57's own dependency graph conflicts here (expo-router pulls in
        # @expo/ui/vaul's Radix peer deps at react-dom@19.2.8 while the app pins
        # react@19.2.3) - confirmed for real via a clean install: plain `npm install`
        # ERESOLVE-fails on this exact chain, same as it did locally when these packages
        # were first added (see mobile/app/README.md's own npm notes).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
        # No native build step here (no Xcode on a Linux runner for iOS; the Android
        # native build needs a real dev-client/EAS run, not plain `expo start`) - this
        # gate is real dependency install, real lint, real typecheck, and the real Jest
        # unit suite, the same honest boundary mobile/app/README.md names for local
        # development on a non-Mac machine.

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks is run directly rather than through its action. The action scans the
      # commit range from a push event, and on the first push of a branch that range
      # starts at the parent of the root commit - which does not exist, so the scan fails
      # having examined nothing. A secret scan that errors out is indistinguishable from
      # one that found something, and worse, a scan that silently examines zero bytes
      # would pass while checking nothing at all.
      #
      # Scanning the full history every time is also simply the right scope: a secret
      # committed six months ago is still leaked today, whether or not this push touched
      # it.
      - name: Gitleaks (full history)
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Upload gitleaks SARIF to code scanning
        if: always()
        continue-on-error: true
        # See the backend job's own comment on this same pattern: needs GitHub Advanced
        # Security, a 403 here on a repo without it is expected, not a real CI failure.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  container-and-iac-scan:
    # Trivy in filesystem mode, not image mode: this workflow doesn't build any of the
    # service Docker images (that happens in infra/, not CI), so there's no built image
    # to scan yet. Filesystem mode still covers real ground without needing one - known-
    # vulnerable versions in every requirements.txt/package.json/package-lock.json across
    # every service (the same class of finding SCA/container scanning both care about),
    # plus a config scan of every Dockerfile and docker-compose.yml for real
    # misconfigurations (running as root, missing HEALTHCHECK, a mounted secret with
    # over-broad permissions). Non-blocking for the same reason pip-audit/bandit/npm
    # audit all are above - a first run against an unreviewed baseline.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy.sarif
        # TODO(Phase 8): triage the baseline and turn exit-code to "1" once it's actually
        # clean rather than merely quiet. `scanners: secret` overlaps with the dedicated
        # `secret-scan` job above by design - two different tools agreeing is more
        # reassuring than either running alone, not redundant.

      - name: Upload Trivy SARIF to code scanning
        if: always()
        continue-on-error: true
        # See the backend job's own comment on this same pattern: needs GitHub Advanced
        # Security, a 403 here on a repo without it is expected, not a real CI failure.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
