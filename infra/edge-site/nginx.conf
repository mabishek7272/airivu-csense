# Serves edge.3rdi.in - a static marketing/portfolio site ("eAIgleye Edge Device
# Portfolio"), not a build target of this repo. Its content (images, PDF, prebuilt HTML)
# was migrated from the previous server's /var/www/edge.3rdi.in and lives on the host at
# EDGE_SITE_CONTENT_DIR (see docker-compose.prod.yml), never committed - the same
# "large binary assets stay out of git" convention the demo site's curated frames
# already follow. Listens on 8080 because the base image (nginx-unprivileged) runs as a
# non-root user, which cannot bind port 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
