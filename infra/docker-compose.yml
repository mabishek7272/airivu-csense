name: csense

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-csense}
  # APIs connect as the restricted, NOBYPASSRLS role â€” never the superuser/owner, which
  # would silently bypass every row-level-security policy (SCH Â§15). The `migrate`
  # service overrides these back to the owner, since DDL needs ownership.
  POSTGRES_USER: ${POSTGRES_API_USER:-csense_api}
  POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_USE_TLS: "false"
  # Presigned URLs are followed by a browser, so they must name a host the
  # browser can resolve - not the compose service name.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
  JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
  JWT_ISSUER: ${JWT_ISSUER:-csense-local}
  JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-600}
  JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-1209600}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
  ARGON2_MEMORY_COST_KB: ${ARGON2_MEMORY_COST_KB:-65536}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
  CUSTOMER_CRM_ORIGIN: ${CUSTOMER_CRM_ORIGIN:-http://localhost:5173}
  DEVELOPER_CONSOLE_ORIGIN: ${DEVELOPER_CONSOLE_ORIGIN:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Notification providers. Each is optional; an unconfigured channel reports itself
  # in the Developer Console rather than failing at send time.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-alerts@example.invalid}
  RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
  WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp-gateway:8080}
  WHATSAPP_GATEWAY_API_KEY: ${WHATSAPP_GATEWAY_API_KEY:-}
  WHATSAPP_INSTANCE_TOKEN: ${WHATSAPP_INSTANCE_TOKEN:-}
  WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-default}
  # Envelope encryption for stored camera credentials. The directory is scanned for
  # *.key files, so rotating is "mount master_v2.key alongside, restart, rewrap" -
  # secrets sealed under v1 stay readable throughout.
  MASTER_KEY_DIR: /run/secrets
  MASTER_KEY_ACTIVE_ID: ${MASTER_KEY_ACTIVE_ID:-}

x-backend-secrets: &backend-secrets
  - jwt_private.pem
  - jwt_public.pem
  - master_v1.key

services:
  traefik:
    image: traefik:v3.1
    command:
      # File provider only â€” no Docker-socket dependency. This is deliberate, not just a
      # Windows-Docker-Desktop workaround: it means Traefik needs no access to the Docker
      # API/socket at all (smaller attack surface, TRD-SEC principle of least privilege),
      # and routing is explicit/reviewable in dynamic.yml rather than inferred from
      # container labels. Revisit if/when the service fleet is dynamic enough that
      # editing a static file per service becomes the bottleneck (tracked in CHECKLIST.md).
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard (dev only â€” never expose in production)
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks: [csense]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csense}
      POSTGRES_USER: ${POSTGRES_USER:-csense_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # dev convenience only â€” TRD-OPS: not exposed publicly in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csense_app} -d ${POSTGRES_DB:-csense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  mediamtx:
    # The `-ffmpeg` variant, not the bare tag: the plain image has no shell or ffmpeg at
    # all (confirmed directly, not assumed - `docker exec ... which ffmpeg` fails because
    # `which` itself isn't there), and WebRTC live view needs a real on-demand transcode
    # (the deployment's real NVR streams H.265, which no mainstream browser's WebRTC stack
    # can decode - see [[nvr-h265-constraint]] and media.py). Pinned to 1.20.1, not
    # `:latest` - the HTTP auth webhook contract and Control API shape this stack depends
    # on were verified against this exact version's real OpenAPI spec.
    image: bluenviron/mediamtx:1.20.1-ffmpeg
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTSP (8554) is deliberately *not* published to the host - nothing in this design
      # needs it from outside the Docker network (MediaMTX only ever pulls from a camera
      # outbound, or receives the WebRTC transcode's own loopback publish, both from
      # inside this network), and leaving it unpublished narrows the real reachability of
      # the path-scoped `authHTTPExclude` for that loopback publish (see mediamtx.yml) to
      # this compose network only, not the whole host.
      - "8889:8889" # WebRTC (signaling)
      - "8189:8189/udp" # WebRTC ICE - not published before this; a browser outside the
        # Docker network cannot complete an ICE handshake without it.
      - "8888:8888" # HLS
      - "9997:9997" # Control API - published for local introspection/e2e verification
        # only, same convenience-port convention as MinIO's console (9001); tenant-api
        # itself reaches this container-to-container and needs no published port.
    networks: [csense]

  migrate:
    build:
      context: ../backend
      dockerfile: migrations/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # DDL requires the owner/superuser; this service also creates the restricted API
      # role that everything else connects as.
      POSTGRES_USER: ${POSTGRES_USER:-csense_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-csense_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      POSTGRES_PLATFORM_API_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PLATFORM_API_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres:
        condition: service_healthy
    networks: [csense]

  tenant-api:
    build:
      context: ../backend
      dockerfile: tenant_api/Dockerfile
    env_file: [../.env]
    environment: *backend-env
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  admin-api:
    build:
      context: ../backend
      dockerfile: admin_api/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # Connects as the platform role â€” a member of the `csense_platform` group role,
      # which the RLS policies require for cross-tenant reads (migration 0005). Only this
      # service and notification-worker use it; the Tenant API's role is deliberately not
      # a member.
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  # Drives notification dispatch. Nothing else sends an alert: the APIs and pipeline only
  # write rows to the queue. Separate from the APIs so a wedged send cannot take request
  # serving down with it, and so it can be scaled on its own â€” several replicas drain the
  # same queue safely because claiming uses FOR UPDATE SKIP LOCKED.
  notification-worker:
    build:
      context: ../backend
      dockerfile: notification_worker/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    # No ports published: the worker accepts no requests at all.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [csense]

  ai-runtime:
    build:
      context: ../backend
      dockerfile: ai_runtime/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # Reads the platform-global model registry (models/model_versions/stored_objects),
      # which carries no tenant_id, so it connects as the platform role like the Admin API.
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
      MODEL_CACHE_DIR: /var/cache/csense/models
      MODEL_POOL_SIZE: ${MODEL_POOL_SIZE:-4}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      # Persist the artifact cache: ~550 MB of models should survive a restart.
      - modelcache:/var/cache/csense/models
    # No Traefik route by design. This service takes raw frames and returns raw
    # detections with no tenant scoping of its own; it is called by the pipeline layer,
    # never directly by a browser or a tenant. Exposing it publicly would bypass the
    # tenant boundary (TRD Â§16).
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  # Dev-only convenience container for exercising the edge agent against this stack
  # (scripts/e2e_edge_spool.py, manual enrolment testing). It is deliberately absent
  # from docker-compose.prod.yml: that file deploys *our* platform on *our* production
  # box (CLAUDE.md: 16 cores/32GB, no GPU, x86). This agent's entire reason to exist is
  # the opposite thing - software that runs on hardware we do not own, sitting in a
  # customer's building, reachable only over whatever connectivity mode that site uses
  # (see CLAUDE.md's "four ways cameras reach the platform" - the same shapes apply to
  # how an edge box reaches the platform). Real fleet deployment is a provisioning
  # problem (imaging a Pi/Jetson, shipping it, WireGuard-enrolling it on site), not a
  # `docker compose up` on our server; putting it in the prod compose file would imply
  # exactly the wrong deployment story.
  edge-agent:
    build:
      context: ../backend/edge_agent
      dockerfile: Dockerfile
    environment:
      # Deliberately NOT `<<: *backend-env` and no `secrets: *backend-secrets`. Those
      # anchors carry the Postgres/Redis/MinIO passwords and the JWT/master-KEK secret
      # mounts - the agent's entire interaction with the platform is unauthenticated-
      # until-enrolled HTTPS to the Tenant API, and it has no legitimate use for any of
      # them. Built explicitly here so a future edit widening *backend-env* cannot
      # silently hand this customer-premises process a platform credential.
      CSENSE_API_BASE_URL: http://tenant-api:8000
      CSENSE_STATE_DIR: /var/lib/csense-agent
      CSENSE_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Unset by default. A real device gets these from its provisioning step (a token
      # minted for one site, a serial pinned to one box) - there is no sane default for
      # either, and the whole point of this dev service is to show the honest
      # unenrolled-agent behaviour (see app/main.py: enrolment is fatal, so the
      # container exits rather than pretending to run). Set both in .env to exercise a
      # real enrolment against this stack.
      CSENSE_ENROLMENT_TOKEN: ${CSENSE_EDGE_ENROLMENT_TOKEN:-}
      CSENSE_SERIAL_NUMBER: ${CSENSE_EDGE_SERIAL_NUMBER:-}
    volumes:
      # The spool (sqlite) and the device key live here. Must be a named volume, not the
      # container's writable layer alone left implicit - an "offline spool" that resets
      # on every restart defeats the one thing this feature exists to do.
      - edgeagentstate:/var/lib/csense-agent
    depends_on:
      tenant-api: { condition: service_started }
    # No ports published. The local detection-source listener binds to 127.0.0.1 inside
    # the container by default (config.py refuses otherwise without a token); nothing in
    # this dev stack runs a co-located inference process that would need to reach it, and
    # a real deployment's inference process shares the device, not this container's
    # published-port surface.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    # No `restart:` policy: unenrolled, the agent fails fast (SystemExit(2), see
    # app/main.py's module docstring on why enrolment failure is fatal rather than
    # retried) and that single, readable exit is the point - a crash-loop would bury it.
    networks: [csense]

  whatsapp-gateway:
    build:
      context: ../edge/whatsapp-gateway
    env_file: [../.env]
    environment:
      SERVER_PORT: 8080
      # Its own databases, separate from the platform's. Session state here is WhatsApp
      # credential material, so it does not share a schema with tenant data.
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER:-csense_app}:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER:-csense_app}:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_users?sslmode=disable
      GLOBAL_API_KEY: ${WHATSAPP_GATEWAY_API_KEY}
      CLIENT_NAME: csense
      OS_NAME: CSense Gateway
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      LOGTYPE: console
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      # It runs as non-root and writes a rotating logfile to ./logs relative to its
      # workdir. Without a writable mount it logs "permission denied" on every write and
      # the file log is silently lost - which is the log you need when a number gets
      # banned and sends start failing.
      - whatsappgatewaylogs:/app/logs
    # Deliberately no Traefik route. This service holds live WhatsApp sessions and its
    # API key can send as your number; it is reachable only from inside the Docker
    # network, and the Admin API proxies every operator action.
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  developer-console:
    build:
      context: ../frontend/developer-console
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    networks: [csense]

  customer-crm:
    build:
      context: ../frontend/customer-crm
    environment:
      VITE_API_BASE: ""
    networks: [csense]

  # Public marketing/demo site. Fully static - every image was rendered offline by
  # scripts/build_demo_assets.py and baked into the build; no environment variables, no
  # API calls at runtime, no auth. Reached only through Traefik like the other two.
  demo-site:
    build:
      context: ../frontend/demo-site
    networks: [csense]

networks:
  csense:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  whatsappgatewaylogs:
  edgeagentstate:

secrets:
  # Master key for envelope-encrypting stored credentials. Mounted as a file rather
  # than an env var so it stays out of `docker inspect` and can be rotated by adding
  # master_v2.key alongside it - old secrets stay readable under the old key.
  master_v1.key:
    file: ./secrets/master_v1.key
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem

