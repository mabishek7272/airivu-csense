name: csense

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-csense}
  # APIs connect as the restricted, NOBYPASSRLS role â€” never the superuser/owner, which
  # would silently bypass every row-level-security policy (SCH Â§15). The `migrate`
  # service overrides these back to the owner, since DDL needs ownership.
  POSTGRES_USER: ${POSTGRES_API_USER:-csense_api}
  POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_USE_TLS: "false"
  # Presigned URLs are followed by a browser, so they must name a host the
  # browser can resolve - not the compose service name.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
  JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
  JWT_ISSUER: ${JWT_ISSUER:-csense-local}
  JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-600}
  JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-1209600}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
  ARGON2_MEMORY_COST_KB: ${ARGON2_MEMORY_COST_KB:-65536}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
  CUSTOMER_CRM_ORIGIN: ${CUSTOMER_CRM_ORIGIN:-http://localhost:5173}
  DEVELOPER_CONSOLE_ORIGIN: ${DEVELOPER_CONSOLE_ORIGIN:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Notification providers. Each is optional; an unconfigured channel reports itself
  # in the Developer Console rather than failing at send time.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-alerts@example.invalid}
  RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
  WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp-gateway:8080}
  WHATSAPP_GATEWAY_API_KEY: ${WHATSAPP_GATEWAY_API_KEY:-}
  WHATSAPP_INSTANCE_TOKEN: ${WHATSAPP_INSTANCE_TOKEN:-}
  WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-default}
  # Envelope encryption for stored camera credentials. The directory is scanned for
  # *.key files, so rotating is "mount master_v2.key alongside, restart, rewrap" -
  # secrets sealed under v1 stay readable throughout.
  MASTER_KEY_DIR: /run/secrets
  MASTER_KEY_ACTIVE_ID: ${MASTER_KEY_ACTIVE_ID:-}

x-backend-secrets: &backend-secrets
  - jwt_private.pem
  - jwt_public.pem
  - master_v1.key

services:
  traefik:
    image: traefik:v3.1
    command:
      # File provider only â€” no Docker-socket dependency. This is deliberate, not just a
      # Windows-Docker-Desktop workaround: it means Traefik needs no access to the Docker
      # API/socket at all (smaller attack surface, TRD-SEC principle of least privilege),
      # and routing is explicit/reviewable in dynamic.yml rather than inferred from
      # container labels. Revisit if/when the service fleet is dynamic enough that
      # editing a static file per service becomes the bottleneck (tracked in CHECKLIST.md).
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard (dev only â€” never expose in production)
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks: [csense]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csense}
      POSTGRES_USER: ${POSTGRES_USER:-csense_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # dev convenience only â€” TRD-OPS: not exposed publicly in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csense_app} -d ${POSTGRES_DB:-csense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [csense]

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554" # RTSP
      - "8889:8889" # WebRTC
      - "8888:8888" # HLS
    networks: [csense]

  migrate:
    build:
      context: ../backend
      dockerfile: migrations/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # DDL requires the owner/superuser; this service also creates the restricted API
      # role that everything else connects as.
      POSTGRES_USER: ${POSTGRES_USER:-csense_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-csense_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      POSTGRES_PLATFORM_API_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PLATFORM_API_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres:
        condition: service_healthy
    networks: [csense]

  tenant-api:
    build:
      context: ../backend
      dockerfile: tenant_api/Dockerfile
    env_file: [../.env]
    environment: *backend-env
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  admin-api:
    build:
      context: ../backend
      dockerfile: admin_api/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # Connects as the platform role â€” a member of the `csense_platform` group role,
      # which the RLS policies require for cross-tenant reads (migration 0005). Only this
      # service and notification-worker use it; the Tenant API's role is deliberately not
      # a member.
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  # Drives notification dispatch. Nothing else sends an alert: the APIs and pipeline only
  # write rows to the queue. Separate from the APIs so a wedged send cannot take request
  # serving down with it, and so it can be scaled on its own â€” several replicas drain the
  # same queue safely because claiming uses FOR UPDATE SKIP LOCKED.
  notification-worker:
    build:
      context: ../backend
      dockerfile: notification_worker/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    # No ports published: the worker accepts no requests at all.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [csense]

  ai-runtime:
    build:
      context: ../backend
      dockerfile: ai_runtime/Dockerfile
    env_file: [../.env]
    environment:
      <<: *backend-env
      # Reads the platform-global model registry (models/model_versions/stored_objects),
      # which carries no tenant_id, so it connects as the platform role like the Admin API.
      POSTGRES_USER: ${POSTGRES_PLATFORM_API_USER:-csense_platform_api}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_API_PASSWORD}
      MODEL_CACHE_DIR: /var/cache/csense/models
      MODEL_POOL_SIZE: ${MODEL_POOL_SIZE:-4}
    secrets: *backend-secrets
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      # Persist the artifact cache: ~550 MB of models should survive a restart.
      - modelcache:/var/cache/csense/models
    # No Traefik route by design. This service takes raw frames and returns raw
    # detections with no tenant scoping of its own; it is called by the pipeline layer,
    # never directly by a browser or a tenant. Exposing it publicly would bypass the
    # tenant boundary (TRD Â§16).
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  whatsapp-gateway:
    build:
      context: ../edge/whatsapp-gateway
    env_file: [../.env]
    environment:
      SERVER_PORT: 8080
      # Its own databases, separate from the platform's. Session state here is WhatsApp
      # credential material, so it does not share a schema with tenant data.
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER:-csense_app}:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER:-csense_app}:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_users?sslmode=disable
      GLOBAL_API_KEY: ${WHATSAPP_GATEWAY_API_KEY}
      CLIENT_NAME: csense
      OS_NAME: CSense Gateway
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: "true"
      LOGTYPE: console
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      # It runs as non-root and writes a rotating logfile to ./logs relative to its
      # workdir. Without a writable mount it logs "permission denied" on every write and
      # the file log is silently lost - which is the log you need when a number gets
      # banned and sends start failing.
      - whatsappgatewaylogs:/app/logs
    # Deliberately no Traefik route. This service holds live WhatsApp sessions and its
    # API key can send as your number; it is reachable only from inside the Docker
    # network, and the Admin API proxies every operator action.
    security_opt: ["no-new-privileges:true"]
    networks: [csense]

  developer-console:
    build:
      context: ../frontend/developer-console
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    networks: [csense]

  customer-crm:
    build:
      context: ../frontend/customer-crm
    environment:
      VITE_API_BASE: ""
    networks: [csense]

  # Public marketing/demo site. Fully static - every image was rendered offline by
  # scripts/build_demo_assets.py and baked into the build; no environment variables, no
  # API calls at runtime, no auth. Reached only through Traefik like the other two.
  demo-site:
    build:
      context: ../frontend/demo-site
    networks: [csense]

networks:
  csense:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  whatsappgatewaylogs:

secrets:
  # Master key for envelope-encrypting stored credentials. Mounted as a file rather
  # than an env var so it stays out of `docker inspect` and can be rotated by adding
  # master_v2.key alongside it - old secrets stay readable under the old key.
  master_v1.key:
    file: ./secrets/master_v1.key
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem

