# Traefik PRODUCTION dynamic configuration - the TLS counterpart to dynamic.yml (which
# stays as the local-dev, plain-HTTP config; this file is not used by the default
# `docker-compose.yml`, only by `docker-compose.prod.yml`).
#
# **Before first deploy, replace every `app.example.com` / `console.example.com` /
# `demo.example.com` / `storage.example.com` / bare `example.com` placeholder below
# with your real domains** (a `sed` one-liner is in docs/10_PRODUCTION_DEPLOYMENT_GUIDE.md)
# - Traefik's file provider does not do environment-variable substitution the way
# docker-compose.yml itself does, so this file needs a real edit, not an env var, to
# carry real domains.
#
# Same routing rules, security headers, rate limits, and CORS shape as dynamic.yml -
# only the entrypoint (websecure/443 instead of web/80) and TLS (a cert resolver on every
# router) actually differ. Keep the two files in sync when you change routing.
http:
  routers:
    tenant-api:
      rule: "PathPrefix(`/api/v1/tenant`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/ws/v1/tenant`) || PathPrefix(`/api/v1/public`)"
      service: tenant-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers, tenant-cors, api-ratelimit]

    admin-api:
      rule: "PathPrefix(`/api/v1/admin`)"
      service: admin-api
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers, platform-cors, api-ratelimit]

    media-hls:
      rule: "PathPrefix(`/media/hls`)"
      service: media-hls
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers, media-strip-hls]

    media-webrtc:
      rule: "PathPrefix(`/media/webrtc`)"
      service: media-webrtc
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers, media-strip-webrtc]

    customer-crm:
      rule: "Host(`app.example.com`)"
      service: customer-crm
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

    # Bare apex domain, same service as customer-crm above - the React app's own
    # client-side routing (frontend/customer-crm/src/App.tsx, main.tsx's slug
    # detection) decides what to show: no brand slug in the path means the parent-
    # company splash (Landing3rdiPage), not the customer-crm login. Only needed if the
    # apex itself is meant to be reachable directly (as opposed to only app.*) - added
    # once a real DNS record for the bare domain existed, not speculatively.
    customer-crm-apex:
      rule: "Host(`example.com`)"
      service: customer-crm
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

    developer-console:
      rule: "Host(`console.example.com`)"
      service: developer-console
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

    demo-site:
      rule: "Host(`demo.example.com`)"
      service: demo-site
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

    # Static marketing/portfolio site, not part of this app - see
    # infra/edge-site/nginx.conf's own comment for what it is and why it isn't a build
    # target of this repo.
    edge-site:
      rule: "Host(`edge.example.com`)"
      service: edge-site
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

    # Public-reachable MinIO S3 API, TLS-terminated here - not the web console (9001,
    # deliberately not routed). docker-compose.prod.yml never publishes MinIO's ports
    # directly (real object storage has no business on a bare public port), so this is
    # the only way presigned/public-read URLs (evidence snapshots, exports, white-label
    # branding logos/favicons) resolve for a real browser at all. `MINIO_PUBLIC_ENDPOINT`
    # must be set to this same hostname - see .env.example. Authorization itself is
    # unaffected: MinIO's own per-bucket policies (deny-all-except-presigned for every
    # bucket except BUCKET_BRANDING, which is deliberately public-read - see
    # csense_shared/storage/objects.py's own module docstring) do the real access
    # control; this router is a TLS-terminating pass-through, not a second auth layer.
    storage:
      rule: "Host(`storage.example.com`)"
      service: minio-storage
      entryPoints: [websecure]
      tls: { certResolver: letsencrypt }
      middlewares: [security-headers]

  services:
    tenant-api:
      loadBalancer:
        servers:
          - url: "http://tenant-api:8000"
    admin-api:
      loadBalancer:
        servers:
          - url: "http://admin-api:8000"
    customer-crm:
      loadBalancer:
        servers:
          - url: "http://customer-crm:8080"
    developer-console:
      loadBalancer:
        servers:
          - url: "http://developer-console:3000"
    demo-site:
      loadBalancer:
        servers:
          - url: "http://demo-site:8080"
    edge-site:
      loadBalancer:
        servers:
          - url: "http://edge-site:8080"
    media-hls:
      loadBalancer:
        servers:
          - url: "http://mediamtx:8888"
    media-webrtc:
      loadBalancer:
        servers:
          - url: "http://mediamtx:8889"
    minio-storage:
      loadBalancer:
        servers:
          - url: "http://minio:9000"

  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        customResponseHeaders:
          X-Permitted-Cross-Domain-Policies: "none"

    tenant-cors:
      headers:
        accessControlAllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type", "X-Correlation-ID", "Idempotency-Key"]
        accessControlAllowOriginList:
          - "https://app.example.com"
        accessControlAllowCredentials: true
        accessControlMaxAge: 600

    platform-cors:
      headers:
        accessControlAllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type", "X-Correlation-ID", "Idempotency-Key"]
        accessControlAllowOriginList:
          - "https://console.example.com"
        accessControlAllowCredentials: true
        accessControlMaxAge: 600

    api-ratelimit:
      rateLimit:
        average: 50
        burst: 100

    media-strip-hls:
      stripPrefix:
        prefixes: ["/media/hls"]

    media-strip-webrtc:
      stripPrefix:
        prefixes: ["/media/webrtc"]
