org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# A real, committed-to-git project default has to work for CI and for every
# contributor's machine, not just the one this app happened to be first built on - a
# 2560m heap is what CI's own D8 dex-merge step actually needed (found by a real CI
# failure: 1280m OOM'd it, see mobile/android/README.md's own "Development machine
# constraints" note). If your own machine is more memory-constrained than that, override
# locally in your user-level ~/.gradle/gradle.properties (Gradle's own standard
# mechanism for a per-developer setting that never gets committed) rather than lowering
# this file - that was the actual mistake this project's own history already made once.
