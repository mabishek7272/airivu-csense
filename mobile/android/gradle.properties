# Kept modest deliberately - this project is built on a memory-constrained development
# machine (see docs/DEVELOPMENT.md); raise these on a machine with more headroom.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Runs the Kotlin compiler inside the Gradle worker rather than spawning its own
# separate, long-lived Kotlin daemon process - a real tradeoff (slower incremental
# rebuilds) worth making on this project's own memory-constrained development machine;
# raise this again (or remove it) on a machine with more headroom.
kotlin.compiler.execution.strategy=in-process
